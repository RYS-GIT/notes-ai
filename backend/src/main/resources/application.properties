spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/notesai
spring.datasource.username=${DB_USER:notesai}
spring.datasource.password=${DB_PASSWORD:notesai}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite

app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:defaultpwd}