services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: notesai
      POSTGRES_USER: notesai
      POSTGRES_PASSWORD: notesai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: notesai
      DB_PASSWORD: notesai
      FRONTEND_URL: http://localhost:4200
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data: